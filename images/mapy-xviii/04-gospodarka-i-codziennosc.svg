<rect x="0" y="600" width="1200" height="300" fill="#f4eee2"/><text x="32" y="646" font-family="Georgia,serif" font-size="32" font-weight="bold" fill="#2f241a">04 • Gospodarka i codzienność</text>
<text x="32" y="682" font-family="Arial,sans-serif" font-size="18" fill="#66594c">Pola, ogrody, folwarki i miejsca wymiany.</text>
<circle cx="38" cy="713" r="5" fill="#8f3f27"/><text x="54" y="718" font-family="Arial,sans-serif" font-size="17" fill="#2f241a">Najważniejszy organizm gospodarczy: dobra wilanowskie. W źródłach z 1737 r. pojawia się karczma Służowska; Szopy i Służew pozostawały osadami rolniczymi.</text>
<text x="870" y="868" font-family="Arial,sans-serif" font-size="13" fill="#786b5c">Źródło: Karol de Perthées, mapa ok. 1786</text></svg>