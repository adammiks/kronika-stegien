<text x="32" y="646" font-family="Georgia,serif" font-size="32" font-weight="bold" fill="#2f241a">01 • Przyszłe Stegny</text>
<text x="32" y="682" font-family="Arial,sans-serif" font-size="18" fill="#66594c">Najważniejsze osady i miejsca tworzące krajobraz przyszłych Stegien.</text>
<circle cx="38" cy="713" r="5" fill="#8f3f27"/><text x="54" y="718" font-family="Arial,sans-serif" font-size="17" fill="#2f241a">Szopy, Służew, Czerniaków, Siekierki i Wilanów — nie jedna miejscowość, lecz sieć osad i dóbr.</text>
<text x="870" y="868" font-family="Arial,sans-serif" font-size="13" fill="#786b5c">Źródło: Karol de Perthées, mapa ok. 1786</text></svg>