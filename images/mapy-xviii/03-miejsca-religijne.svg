<text x="32" y="682" font-family="Arial,sans-serif" font-size="18" fill="#66594c">Kościoły i klasztor jako stałe punkty krajobrazu.</text>
<circle cx="38" cy="713" r="5" fill="#8f3f27"/><text x="54" y="718" font-family="Arial,sans-serif" font-size="17" fill="#2f241a">Służew — św. Katarzyna; Czerniaków — św. Antoni i klasztor bernardynów; Wilanów — św. Anna (1772).</text>
<text x="870" y="868" font-family="Arial,sans-serif" font-size="13" fill="#786b5c">Źródło: Karol de Perthées, mapa ok. 1786</text></svg>