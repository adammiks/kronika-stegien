<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Czerniaków w XV wieku — artystyczna rekonstrukcja</title>
<desc id="desc">Drewniana huśtawka, wiejskie zabudowania i pola na nadrzecznej równinie.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#8db5cf"/><stop offset=".63" stop-color="#f5d7a0"/><stop offset="1" stop-color="#e9bd79"/></linearGradient>
 <linearGradient id="land" x2="0" y2="1"><stop stop-color="#a7b56e"/><stop offset="1" stop-color="#586b3e"/></linearGradient>
 <linearGradient id="wood" x2="1" y2="0"><stop stop-color="#513a27"/><stop offset=".45" stop-color="#9a7045"/><stop offset="1" stop-color="#392d23"/></linearGradient>
 <linearGradient id="river" x2="0" y2="1"><stop stop-color="#8bb7bc"/><stop offset="1" stop-color="#467e88"/></linearGradient>
 <linearGradient id="thatch" x2="0" y2="1"><stop stop-color="#b5a078"/><stop offset="1" stop-color="#62523b"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
 <pattern id="grass" width="44" height="38" patternUnits="userSpaceOnUse"><path d="M8 38l4-12m5 12l-2-8m18 8l5-15" stroke="#d0c27c" stroke-width="2" opacity=".55"/></pattern>
